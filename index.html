<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>To-Do App</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/storage.js" defer></script>
  <script src="js/tasks.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="app-header" role="banner">
    <h1 id="app-title">My To-Do List</h1>
  </header>

  <main class="app-main" role="main">
    <form id="task-form" class="task-form" aria-label="Add a new task" novalidate>
      <label for="task-input" class="visually-hidden">Task description</label>
      <input
        type="text"
        id="task-input"
        name="task"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="500"
        aria-label="New task description"
        aria-describedby="add-task-hint"
      >
      <button type="submit" id="add-task-btn" class="btn btn-add">Add</button>
      <span id="add-task-hint" class="visually-hidden">
        Press Enter or the Add button to create a task. Empty tasks are ignored.
      </span>
    </form>

    <section class="filter-section" aria-label="Filter tasks">
      <div class="filter-buttons" role="group" aria-label="Filter tasks by status">
        <button type="button" id="filter-all" class="filter-btn active"
                data-filter="all" aria-pressed="true">All</button>
        <button type="button" id="filter-active" class="filter-btn"
                data-filter="active" aria-pressed="false">Active</button>
        <button type="button" id="filter-completed" class="filter-btn"
                data-filter="completed" aria-pressed="false">Completed</button>
      </div>
    </section>

    <ul id="task-list" class="task-list" role="list"
        aria-label="List of tasks" aria-describedby="task-counter"></ul>
  </main>

  <footer class="app-footer" role="contentinfo">
    <div class="footer-content">
      <span id="task-counter" class="task-counter"
            role="status" aria-live="polite" aria-atomic="true">
        0 of 0 completed
      </span>
      <button type="button" id="clear-completed-btn" class="btn btn-clear"
              aria-label="Clear all completed tasks">Clear Completed</button>
    </div>
  </footer>
</body>
</html>
